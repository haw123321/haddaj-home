<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>هدّاج — افتح المحتوى في التطبيق</title>
  <style>
    :root { color-scheme: light; --navy:#0d1b2a; --blue:#007aff; --gold:#c9a84c; --muted:#66758a; --line:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#eef2f6; color:var(--navy); font-family:Tahoma,Arial,sans-serif; }
    main { width:min(100%,560px); overflow:hidden; border-radius:24px; background:#fff; box-shadow:0 18px 55px rgba(13,27,42,.14); text-align:center; }
    header { padding:34px 24px 28px; color:#fff; background:linear-gradient(145deg,var(--navy),#173652); }
    .mark { display:inline-grid; place-items:center; width:70px; height:70px; margin-bottom:16px; border-radius:20px; background:#fff; color:var(--blue); font-size:30px; font-weight:900; box-shadow:0 8px 30px rgba(0,122,255,.25); }
    h1 { margin:0; font-size:27px; line-height:1.5; }
    .tag { margin:8px 0 0; color:rgba(255,255,255,.72); font-size:14px; }
    section { padding:30px 24px 34px; }
    p { margin:0 auto 22px; max-width:440px; color:var(--muted); line-height:1.9; }
    .actions { display:grid; gap:12px; }
    a { display:block; padding:14px 18px; border-radius:13px; text-decoration:none; font-weight:700; }
    .primary { color:#fff; background:var(--blue); }
    .store { color:var(--navy); border:1px solid var(--line); background:#fff; }
    .home { color:var(--muted); font-size:14px; }
    .note { margin-top:20px; color:#8a97a8; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">هـ</div>
      <h1 id="title">افتح المحتوى في تطبيق هدّاج</h1>
      <p class="tag">خريطة حيّة للمحتوى المحلي</p>
    </header>
    <section>
      <p id="message">إذا كان التطبيق مثبتًا، اضغط الزر لفتح الوجهة مباشرة. ويمكنك تنزيل هدّاج من المتجر.</p>
      <div class="actions" id="link-actions">
        <a class="primary" id="open-app" href="/">فتح في تطبيق هدّاج</a>
        <a class="store" href="https://apps.apple.com/app/haddaj/id6757466488" rel="noopener noreferrer">التنزيل من App Store</a>
        <a class="store" href="https://play.google.com/store/apps/details?id=com.app.haddaj" rel="noopener noreferrer">التنزيل من Google Play</a>
        <a class="home" href="/">العودة إلى موقع هدّاج</a>
      </div>
      <p class="note" id="note">لن تعرض هذه الصفحة أي بيانات خاصة بالمحتوى.</p>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const match = window.location.pathname.match(/^\/(offer|store)\/([A-Za-z0-9_-]{1,128})\/?$/);
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const openApp = document.getElementById('open-app');
      const note = document.getElementById('note');

      if (!match) {
        document.title = 'هدّاج — الصفحة غير موجودة';
        title.textContent = 'الصفحة غير موجودة';
        message.textContent = 'تأكد من الرابط أو عد إلى الصفحة الرئيسية لموقع هدّاج.';
        openApp.hidden = true;
        note.textContent = 'رمز الخطأ: 404';
        return;
      }

      const kind = match[1];
      document.title = kind === 'offer' ? 'هدّاج — فتح العرض' : 'هدّاج — فتح المتجر';
      title.textContent = kind === 'offer' ? 'افتح العرض في تطبيق هدّاج' : 'افتح المتجر في تطبيق هدّاج';
      openApp.href = window.location.href;
    })();
  </script>
</body>
</html>
